<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%230a7c3a' stroke='%23fff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23e6ffe6' stroke='%23064a1f' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fff' stroke='%230a7c3a' stroke-width='2'/%3E%3Cpath d='M32 16 L32 32 L48 32' stroke='%23110202' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <title>Aham Brahmasmi</title>
    <!-- Google Fonts: Lobster -->
    <link href="https://fonts.googleapis.com/css?family=Lobster&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lobster', cursive;
            margin: 30px;
            background: #010a04;
            color: #110202;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .circle-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            background: #2c0303;
            color: #2c0303;
            text-decoration: none;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
            font-size: 0.75rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 4px solid #2c0303;
        }

        .circle-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
            background: #063306;
        }

        .circle-btn .logo {
            display: inline-block;
            margin-bottom: 0;
            font-size: 2rem;
            line-height: 1;
            text-align: center;
        }

        .circle-btn.pragati .logo {
            font-size: 5.1rem;
        }

        .circle-btn.wellness .logo {
            font-size: 5.1rem;
        }

        .circle-btn.time .logo {
            font-size: 5.1rem;
        }
    </style>
</head>

<body>

    <div class="button-row">
        <a class="circle-btn pragati" href="https://viveksingh007e.github.io/pragati/">
            <span class="logo">📈</span>
        </a>
        <a class="circle-btn wellness" href="https://viveksingh007e.github.io/wellnesstimer/">
            <span class="logo">🤸</span>
        </a>
        <a class="circle-btn time" href="https://viveksingh007e.github.io/mytime/">
            <span class="logo">⏰</span>
        </a>
    </div>
    <div class="button-row">
        <a class="circle-btn pragati" href="https://viveksingh007e.github.io/fluteMaster/">
            <span class="logo">💼</span>
        </a>
        
        
    </div>

</body>

</html>
